    <!-- Dynamic PWA Manifest with access code -->
    <script>
      // Dynamic manifest loading with access code for Safari compatibility
      (function() {
        const urlParams = new URLSearchParams(window.location.search);
        const accessCode = urlParams.get('access') || localStorage.getItem('accessCode');
        const manifestUrl = accessCode ? `/manifest.json?access=${accessCode}` : '/manifest.json';
        
        // Remove any existing manifest links to prevent conflicts
        const existingManifest = document.querySelector('link[rel="manifest"]');
        if (existingManifest) {
          existingManifest.remove();
        }
        
        // Create and inject manifest link immediately
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = manifestUrl;
        manifestLink.crossOrigin = 'anonymous';
        document.head.appendChild(manifestLink);
        
        // Enhanced Safari compatibility
        if (navigator.userAgent.includes('Safari') && !navigator.userAgent.includes('Chrome')) {
          // Multiple approaches for Safari recognition
          
          // Method 1: Prefetch with custom headers
          const preloadLink = document.createElement('link');
          preloadLink.rel = 'prefetch';
          preloadLink.href = manifestUrl;
          preloadLink.crossOrigin = 'anonymous';
          document.head.appendChild(preloadLink);
          
          // Method 2: Force fetch with access code header
          const headers = new Headers();
          if (accessCode) {
            headers.append('X-Access-Code', accessCode);
          }
          
          fetch(manifestUrl, { 
            method: 'GET',
            headers: headers,
            cache: 'no-cache',
            mode: 'cors'
          }).then(response => {
            if (response.ok) {
              console.log('Manifest preloaded for Safari with access code:', accessCode);
            }
          }).catch(() => {
            console.warn('Manifest preload failed, but will still work');
          });
          
          // Method 3: Safari-specific PWA setup
          setTimeout(() => {
            if (window.navigator.standalone === false) {
              // User is in Safari but not installed as PWA
              console.log('Safari detected - manifest ready for Add to Home Screen');
            }
          }, 100);
        }
        
        // Log for debugging
        console.log('Dynamic manifest loaded:', manifestUrl);
      })();
    </script>

  <body style="background-color: #000DFF !important;" data-initial-bg="true">
    <div id="loading-screen" style="
      position:fixed;
      top:0;
      left:0;
      width:100vw;
      height:100vh;
      background-image:url('/IMG_0633_1749764752035.jpeg');
      background-size:cover;
      background-position:center;
      background-repeat:no-repeat;
      background-color:#000DFF;
      z-index:9999;
    ">
      <div style="position:absolute;bottom:30%;left:50%;transform:translateX(-50%);">
        <div style="width:24px;height:24px;border:2px solid white;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;opacity:0.9;"></div>
      </div>
    </div>
    
    <div id="root" style="background: transparent !important;"></div>
    
    <style>
      @keyframes spin { to { transform: rotate(360deg); } }
      
      /* Responsive viewport fixes */
      @media screen and (max-width: 768px) {
        html { font-size: 16px; }
        body { 
          -webkit-text-size-adjust: 100%; 
          -ms-text-size-adjust: 100%;
          touch-action: manipulation;
        }
      }
      
      /* PWA-specific styles */
      @media all and (display-mode: standalone) {
        html, body { 
          height: 100vh;
          height: calc(var(--vh, 1vh) * 100);
          padding-top: 0;
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
          padding-right: env(safe-area-inset-right);
          overflow-x: hidden;
        }
        
        #root {
          min-height: 100vh;
          min-height: calc(var(--vh, 1vh) * 100);
        }
      }
      
      /* Fix for iOS viewport issues */
      @supports (-webkit-touch-callout: none) {
        html, body {
          height: -webkit-fill-available;
        }
        
        #root {
          min-height: -webkit-fill-available;
        }
      }
      
      /* Error state styles */
      .error-state {
        background: #dc2626 !important;
        color: white !important;
      }
    </style>
    
    <script>
      // Keep body background blue during load for the splash screen visual
      // but do NOT change theme-color — on iOS 26 Liquid Glass the status bar
      // reads theme-color and gets stuck on the blue if we change it here
      document.body.style.backgroundColor = '#000DFF';
      document.documentElement.style.backgroundColor = '#000DFF';

      // Security measures to prevent sharing and copying
      document.addEventListener('DOMContentLoaded', function() {
        // Disable right-click context menu
        document.addEventListener('contextmenu', function(e) {
          e.preventDefault();
          return false;
        });

        // Security restrictions that don't interfere with form inputs
        document.addEventListener('selectstart', function(e) {
          // Allow text selection in form elements
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return true;
          }
          e.preventDefault();
          return false;
        });

        // Disable keyboard shortcuts for security (excluding form interference)
        document.addEventListener('keydown', function(e) {
          // Allow all keyboard input in form elements
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') {
            return true;
          }
          
          // Block developer tools shortcuts only outside forms
          if (e.key === 'F12' || 
              (e.ctrlKey && e.shiftKey && ['I', 'C', 'J'].includes(e.key))) {
            e.preventDefault();
            return false;
          }
        });

        // Disable image drag
        const images = document.querySelectorAll('img');
        images.forEach(img => {
          img.addEventListener('dragstart', function(e) {
            e.preventDefault();
            return false;
          });
        });

        // Hide URL bar on mobile
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          setTimeout(function() {
            window.scrollTo(0, 1);
          }, 100);
        }

      });

      // Developer tools detection removed - was causing form interference

      // PWA App Initialization with Error Handling
      let appLoadTimeout;
      let retryCount = 0;
      const maxRetries = 3;
      
      function updateLoadingMessage(message) {
        const loadingMsg = document.getElementById('loading-message');
        if (loadingMsg) loadingMsg.textContent = message;
      }
      
      function showError(message) {
        const loadingScreen = document.getElementById('pwa-loading');
        const errorMsg = document.getElementById('error-message');
        const retryBtn = document.getElementById('retry-button');
        
        if (loadingScreen) loadingScreen.classList.add('error-state');
        if (errorMsg) {
          errorMsg.textContent = message;
          errorMsg.style.display = 'block';
        }
        if (retryBtn) retryBtn.style.display = 'block';
      }
      
      function hideLoading() {
        const loadingScreen = document.getElementById('pwa-loading');
        if (loadingScreen) {
          loadingScreen.style.opacity = '0';
          loadingScreen.style.transition = 'opacity 0.3s ease';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
          }, 300);
        }
      }
      
      function retryAppLoad() {
        retryCount++;
        if (retryCount > maxRetries) {
          showError('Multiple attempts failed. Please check your connection and refresh the page.');
          return;
        }
        
        updateLoadingMessage(`Retrying... (${retryCount}/${maxRetries})`);
        document.getElementById('error-message').style.display = 'none';
        document.getElementById('retry-button').style.display = 'none';
        document.getElementById('pwa-loading').classList.remove('error-state');
        
        setTimeout(initializeApp, 1000);
      }
      
      function initializeApp() {
        clearTimeout(appLoadTimeout);
        
        // Set timeout for app initialization
        appLoadTimeout = setTimeout(() => {
          console.error('App initialization timeout');
          showError('App is taking longer than expected to load. This might be due to a slow connection.');
        }, 15000);
        
        // Monitor for successful React mount
        const checkAppReady = setInterval(() => {
          const root = document.getElementById('root');
          if (root && root.children.length > 0) {
            clearInterval(checkAppReady);
            clearTimeout(appLoadTimeout);
            hideLoading();
          }
        }, 100);
        
        // The main React app script is already in the HTML
        // Just wait for it to mount
        console.log('Waiting for React app to mount...');
      }
      
      // Enhanced service worker registration for mobile PWA
      if ('serviceWorker' in navigator) {
        updateLoadingMessage('Preparing offline features...');
        
        navigator.serviceWorker.register('/sw.js', {
          scope: '/',
          updateViaCache: 'none'
        }).then(async (registration) => {
          console.log('Service Worker registered:', registration.scope);
          
          // Force immediate activation for better mobile experience
          if (registration.waiting) {
            registration.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          
          // Listen for updates and auto-activate
          registration.addEventListener('updatefound', () => {
            const newWorker = registration.installing;
            if (newWorker) {
              newWorker.addEventListener('statechange', () => {
                if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('New service worker available');
                  newWorker.postMessage({ type: 'SKIP_WAITING' });
                }
              });
            }
          });
          
          // Ensure service worker takes control immediately
          if (!navigator.serviceWorker.controller) {
            console.log('Claiming service worker control for mobile');
            await registration.update();
          }
          
          updateLoadingMessage('Loading banking app...');
          setTimeout(initializeApp, 500);
          
        }).catch((error) => {
          console.error('Service worker registration failed:', error);
          updateLoadingMessage('Loading banking app...');
          setTimeout(initializeApp, 500);
        });
        
        // Listen for service worker messages
        navigator.serviceWorker.addEventListener('message', (event) => {
          if (event.data && event.data.type === 'SW_ACTIVATED') {
            console.log('Service worker activated for offline support');
          }
        });
      } else {
        // No service worker support, load app directly
        updateLoadingMessage('Loading banking app...');
        setTimeout(initializeApp, 500);
      }
      
      // Handle app visibility changes
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') {
          // App became visible, check if it's working
          const root = document.getElementById('root');
          if (!root || root.children.length === 0) {
            const loadingScreen = document.getElementById('pwa-loading');
            if (loadingScreen && loadingScreen.style.display === 'none') {
              // App was supposed to be loaded but root is empty
              loadingScreen.style.display = 'flex';
              showError('App lost connection. Refreshing...');
              setTimeout(() => window.location.reload(), 2000);
            }
          }
        }
      });
      
      // PWA Error Logging and Reporting System
      function logPWAError(error, context = '') {
        const isPWA = window.matchMedia('(display-mode: standalone)').matches;
        const errorData = {
          timestamp: new Date().toISOString(),
          isPWA: isPWA,
          context: context,
          userAgent: navigator.userAgent,
          url: window.location.href,
          error: {
            message: error.message || error,
            stack: error.stack,
            name: error.name
          }
        };
        
        console.error('PWA Error:', errorData);
        
        // Store errors locally for debugging
        try {
          const errors = JSON.parse(localStorage.getItem('pwa-errors') || '[]');
          errors.push(errorData);
          // Keep only last 50 errors
          if (errors.length > 50) errors.splice(0, errors.length - 50);
          localStorage.setItem('pwa-errors', JSON.stringify(errors));
        } catch (e) {
          console.error('Failed to store error:', e);
        }
        
        return errorData;
      }
      
      // Global error handler for unhandled errors
      window.addEventListener('error', (event) => {
        logPWAError(event.error, 'Global error handler');
        const loadingScreen = document.getElementById('pwa-loading');
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          showError('Error loading app components. Please try again.');
        }
      });
      
      // Global promise rejection handler
      window.addEventListener('unhandledrejection', (event) => {
        logPWAError(event.reason, 'Unhandled promise rejection');
        const loadingScreen = document.getElementById('pwa-loading');
        if (loadingScreen && loadingScreen.style.display !== 'none') {
          showError('Network error occurred. Please check your connection.');
        }
      });
      
      // PWA-specific event listeners
      if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('Running in PWA mode');
        
        // Detect PWA launch
        window.addEventListener('load', () => {
          logPWAError({ message: 'PWA launched' }, 'PWA launch event');
        });
        
        // Handle orientation changes
        window.addEventListener('orientationchange', () => {
          setTimeout(() => {
            // Force layout recalculation
            document.body.style.height = '100vh';
            window.scrollTo(0, 0);
          }, 100);
        });
        
        // Handle resize events for different devices
        window.addEventListener('resize', () => {
          clearTimeout(window.resizeTimeout);
          window.resizeTimeout = setTimeout(() => {
            const vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', vh + 'px');
          }, 100);
        });
        
        // Set initial viewport height
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', vh + 'px');
      }

      // Additional mobile-specific URL hiding
      window.addEventListener('load', function() {
        // Force fullscreen on mobile devices
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          // Hide address bar completely
          setTimeout(function() {
            window.scrollTo(0, 1);
            
            // Request fullscreen if available
            if (document.documentElement.requestFullscreen) {
              document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
              document.documentElement.webkitRequestFullscreen().catch(() => {});
            }
          }, 1000);
        }
      });

      // Access control system
      async function checkAccess() {
        const loader = document.getElementById('loading-screen');
        
        try {
          // Check if user already has access granted
          const hasAccess = localStorage.getItem('accessGranted');
          if (hasAccess === 'true') {
            hideLoadingScreen();
            return;
          }

          // Check for access code in URL
          const urlParams = new URLSearchParams(window.location.search);
          const accessCode = urlParams.get('access');
          
          if (!accessCode) {
            // No access code and no stored access - show "Not available"
            showAccessDenied("Not available");
            return;
          }

          // Verify access code with backend
          const response = await fetch('/api/check-access', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({ code: accessCode })
          });

          const result = await response.json();

          if (result.success) {
            // Access granted - save to localStorage and clean URL
            localStorage.setItem('accessGranted', 'true');
            localStorage.setItem('accessCode', accessCode);
            window.history.replaceState({}, document.title, window.location.pathname);
            console.log('Access granted successfully');
            hideLoadingScreen();
            // Start periodic access validation
            startAccessValidation();
          } else {
            // Access denied - show appropriate message
            const message = result.message || "Access code invalid or expired";
            showAccessDenied(message);
          }
        } catch (error) {
          console.error('Access verification failed:', error);
          // If verification fails due to connection issues, prioritize existing access
          const hasAccess = localStorage.getItem('accessGranted');
          if (hasAccess === 'true') {
            console.log('Connection error but user has existing access - allowing entry');
            hideLoadingScreen();
            // Still start validation to check later when connection is restored
            startAccessValidation();
          } else {
            // Only deny access if they have no existing access AND connection fails
            showAccessDenied("Connection error - please try again");
          }
        }
      }

      function showAccessDenied(message) {
        // Redirect away from site when no access
        window.location.href = 'https://www.google.com';
      }

      function hideLoadingScreen() {
        const loader = document.getElementById('loading-screen');
        if (loader) {
          loader.style.display = 'none';
        }
      }

      // Periodic access validation to check for revocation
      function startAccessValidation() {
        const accessCode = localStorage.getItem('accessCode');
        if (!accessCode) return;

        // Check access every 30 seconds
        setInterval(async () => {
          try {
            const response = await fetch('/api/check-access', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ code: accessCode })
            });

            // Only process response if request was successful
            if (response.ok) {
              const result = await response.json();

              // Only revoke if explicitly told access is denied/revoked
              if (!result.success && result.error === "Access denied or revoked") {
                console.log('Access revoked by administrator');
                localStorage.removeItem('accessGranted');
                localStorage.removeItem('accessCode');
                showAccessDenied("Access denied or revoked");
              }
            } else {
              // Network/server errors don't affect access - user stays logged in
              console.warn('Access validation failed due to connection issue - maintaining access');
            }
          } catch (error) {
            // Connection errors don't affect access - user stays logged in
            console.warn('Access validation check failed due to connection - maintaining access:', error);
          }
        }, 30000);
      }

      // Initialize access check when DOM is ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', checkAccess);
      } else {
        checkAccess();
      }

      // Fallback timeout for slow connections
      setTimeout(() => {
        const loader = document.getElementById('loading-screen');
        const hasAccess = localStorage.getItem('accessGranted');
        if (hasAccess === 'true' && loader) {
          loader.style.display = 'none';
        }
      }, 15000);
    </script>
